<!doctype html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>پیتزا کسری | آموزش کسرهای هم‌مخرج</title>
<style>
:root{
  color-scheme:light;
  --bg:#F1F5EF; --surface:#FFFFFF; --fg:#1D2A22; --muted:#56675C; --line:#D2DCD0;
  --tomato:#D43F2A; --cheese:#F4B82E; --basil:#2E8B57; --empty:#E9EFE6; --crust:#C98A4B;
  --good-bg:#E1F3E8; --bad-bg:#FBE4E0; --on-accent:#FFFFFF;
  --t0:#D43F2A; --t1:#2E8B57; --t2:#2F6FD0; --t3:#C98A0B;
  --f-display:'Vazirmatn','IRANSans','Segoe UI',Tahoma,sans-serif;
  --f-body:'Vazirmatn','IRANSans','Segoe UI',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141C17; --surface:#1E2922; --fg:#EEF3EC; --muted:#9DB0A3; --line:#33443A;
    --tomato:#F0624D; --cheese:#F6C74F; --basil:#4DBB7F; --empty:#2A3830; --crust:#D79A5A;
    --good-bg:#1D3A2A; --bad-bg:#432322; --on-accent:#10160F;
    --t0:#F0624D; --t1:#4DBB7F; --t2:#6FA0F0; --t3:#E8B13A; color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:16px; line-height:1.7;
  padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:980px;margin:0 auto}
h1,h2{font-family:var(--f-display);font-weight:900;margin:0;line-height:1.25}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--basil);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}

/* setup */
.hero{display:flex;align-items:center;gap:18px;margin-bottom:20px;flex-wrap:wrap}
.hero .pz{width:88px;flex:none}
.hero h1{font-size:clamp(2rem,5.5vw,3rem);color:var(--tomato)}
.hero p{margin:4px 0 0;color:var(--muted);font-weight:600}
.setup{display:grid;gap:18px}
.field{display:grid;gap:8px}
.field>label,.field>.lbl{font-weight:800}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-height:44px;padding:6px 16px;border:2px solid var(--line);background:var(--bg);border-radius:10px;font-weight:600;transition:.15s}
.seg button[aria-pressed="true"]{border-color:var(--basil);background:var(--basil);color:var(--on-accent)}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.names input{width:100%;min-height:44px;padding:6px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;border-inline-start:8px solid var(--tc)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--basil)}
.rule{background:var(--empty);border-radius:12px;padding:14px 16px}
.rule b{color:var(--tomato)}
.btn{min-height:52px;padding:8px 28px;border:0;border-radius:12px;background:var(--tomato);color:#fff;font-weight:800;font-size:1.15rem}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#1a0d0b}}
.btn.alt{background:var(--basil);color:var(--on-accent)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--fg);font-size:1rem;min-height:44px;padding:4px 16px}

/* game */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.round{font-weight:800}
.bar{height:10px;border-radius:6px;background:var(--empty);overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:100%;background:var(--basil);transform-origin:right center}
.teams{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.team{flex:1 1 130px;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);opacity:.7}
.team.on{opacity:1;border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 25%,transparent)}
.tn{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tc)}
.ts{font-family:var(--f-display);font-weight:900;font-size:1.5rem;line-height:1}
.turn{font-weight:800;margin-bottom:6px}
.turn span{color:var(--tc)}
.ask{margin:0 0 6px;color:var(--muted);font-weight:600}
.eq{direction:ltr;display:flex;align-items:flex-start;justify-content:center;gap:clamp(6px,2vw,22px);flex-wrap:wrap;padding:10px 0 16px}
.term{display:grid;justify-items:center;gap:6px}
.term .pz{width:clamp(72px,15vw,128px);height:auto}
.qm{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;border:3px dashed var(--muted);color:var(--muted);font-weight:900;font-size:2.2rem}
.sym{align-self:center;font-weight:900;font-size:clamp(1.8rem,5vw,3rem);color:var(--muted)}
.fr{display:inline-flex;flex-direction:column;align-items:center;font-weight:800;font-size:clamp(1.5rem,4vw,2.5rem);line-height:1.15;min-width:1.4em}
.fr .n{border-bottom:3px solid currentColor;padding:0 .25em;width:100%;text-align:center}
.fr .d{padding:0 .25em}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:700px){.opts{grid-template-columns:repeat(4,1fr)}}
.opt{position:relative;min-height:96px;display:grid;place-items:center;border:3px solid var(--line);border-radius:14px;background:var(--bg);padding:10px;font-size:1.4rem;font-weight:800}
.opt .key{position:absolute;top:6px;inset-inline-start:10px;font-size:.8rem;color:var(--muted);font-weight:600}
.opt .big{font-size:2.2rem;font-weight:900}
.opt:hover:not(:disabled){border-color:var(--basil)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--basil);background:var(--good-bg)}
.opt.wrong{border-color:var(--tomato);background:var(--bad-bg)}
.fb{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--empty)}
.fb strong{display:block;font-size:1.15rem;margin-bottom:4px}
.fb.ok strong{color:var(--basil)}
.fb.no strong{color:var(--tomato)}
.next{margin-top:14px;display:flex;justify-content:flex-end}

/* results */
.win{text-align:center;display:grid;gap:14px;justify-items:center}
.win h2{font-size:clamp(1.8rem,5vw,2.8rem);color:var(--tomato)}
.rank{display:grid;gap:8px;width:min(480px,100%)}
.rank div{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:800}
.rank div:first-child{border-color:var(--cheese);background:color-mix(in srgb,var(--cheese) 22%,var(--surface))}
.solo-stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.stat-box{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 20px;min-width:130px}
.stat-box b{display:block;font-size:1.6rem;color:var(--basil)}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.92)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
</style>
</head>
<body>

<div class="app">

  <section id="setup">
    <div class="hero">
      <svg class="pz" viewBox="0 0 100 100" aria-hidden="true" id="heroPz"></svg>
      <div>
        <h1>پیتزا کسری</h1>
        <p>جمع و تفریق کسرهای هم‌مخرج · ریاضی پایه چهارم</p>
      </div>
    </div>
    <div class="card setup">
      <div class="field">
        <span class="lbl">حالت بازی</span>
        <div class="seg" id="segTeams">
          <button type="button" data-v="1" aria-pressed="true">۱ نفره (تمرین فردی)</button>
          <button type="button" data-v="2" aria-pressed="false">۲ تیم</button>
          <button type="button" data-v="3" aria-pressed="false">۳ تیم</button>
          <button type="button" data-v="4" aria-pressed="false">۴ تیم</button>
        </div>
      </div>
      <div class="field">
        <span class="lbl" id="namesLbl">نام دانش‌آموز</span>
        <div class="names" id="names"></div>
      </div>
      <div class="field">
        <span class="lbl">سطح دشواری</span>
        <div class="seg" id="segLevel">
          <button type="button" data-v="1" aria-pressed="true">آسان (مخرج ۳ تا ۵)</button>
          <button type="button" data-v="2" aria-pressed="false">متوسط (مخرج ۴ تا ۸)</button>
          <button type="button" data-v="3" aria-pressed="false">چالشی (تا ۱۲ و عدد گم‌شده)</button>
        </div>
      </div>
      <div class="field">
        <span class="lbl" id="perLbl">تعداد سوال‌ها</span>
        <div class="seg" id="segPer">
          <button type="button" data-v="4" aria-pressed="false">۴ سوال</button>
          <button type="button" data-v="6" aria-pressed="true">۶ سوال</button>
          <button type="button" data-v="10" aria-pressed="false">۱۰ سوال</button>
        </div>
      </div>
      <label class="chk" for="timed"><input type="checkbox" id="timed" checked> زمان‌دار (۳۰ ثانیه برای هر سوال + امتیاز سرعت)</label>
      <div class="rule">
        <b>قاعده‌ی امروز:</b> وقتی مخرج‌ها برابرند، مخرج تغییر نمی‌کند؛ فقط صورت‌ها را جمع یا تفریق می‌کنیم.
        مثال: ۳ هشتم + ۲ هشتم = ۵ هشتم.
      </div>
      <div><button type="button" class="btn" id="startBtn">شروع بازی</button></div>
    </div>
  </section>

  <section id="game" hidden>
    <div class="top">
      <span class="round" id="roundTxt"></span>
      <div style="display:flex;gap:8px">
        <button type="button" class="btn ghost" id="quitBtn">تغییر تنظیمات</button>
        <button type="button" class="btn ghost" id="fsBtn">تمام‌صفحه</button>
      </div>
    </div>
    <div class="bar" id="barWrap"><i id="barFill"></i></div>
    <div class="teams" id="teamsEl"></div>
    <div class="card">
      <div class="turn" id="turnTxt"></div>
      <p class="ask" id="askTxt"></p>
      <div class="eq" id="eq"></div>
      <div class="opts" id="opts"></div>
      <div id="fbWrap"></div>
      <div class="next"><button type="button" class="btn alt" id="nextBtn" hidden>سوال بعدی</button></div>
    </div>
  </section>

  <section id="results" hidden>
    <div class="card win">
      <h2 id="winTxt"></h2>
      <div id="soloWrap" class="solo-stats" hidden></div>
      <div class="rank" id="rank"></div>
      <div><button type="button" class="btn" id="againBtn">بازی دوباره</button></div>
    </div>
  </section>

</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const fa = s => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
  const fr = (n, d) => '<span class="fr"><span class="n">' + fa(n) + '</span><span class="d">' + fa(d) + '</span></span>';
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  const LEVELS = { 1: { min: 3, max: 5 }, 2: { min: 4, max: 8 }, 3: { min: 6, max: 12 } };
  const LIMIT = 30;
  let level = 1, per = 6, tcount = 1, timed = true;
  let soloName = 'دانش‌آموز پرتلاش';
  const teamNames = ['تیم قرمز', 'تیم سبز', 'تیم آبی', 'تیم زرد'];
  let teams = [], turn = 0, qi = 0, total = 0, cur = null, locked = false, timer = null, startAt = 0;

  function pizza(n, d) {
    const r = 47;
    let s = '<svg class="pz" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="49.5" fill="var(--crust)"/>';
    for (let i = 0; i < d; i++) {
      const a0 = -Math.PI / 2 + i * 2 * Math.PI / d, a1 = -Math.PI / 2 + (i + 1) * 2 * Math.PI / d;
      const x0 = (50 + r * Math.cos(a0)).toFixed(2), y0 = (50 + r * Math.sin(a0)).toFixed(2);
      const x1 = (50 + r * Math.cos(a1)).toFixed(2), y1 = (50 + r * Math.sin(a1)).toFixed(2);
      const on = i < n;
      s += '<path d="M50 50L' + x0 + ' ' + y0 + 'A' + r + ' ' + r + ' 0 0 1 ' + x1 + ' ' + y1 + 'Z" fill="' + (on ? 'var(--cheese)' : 'var(--empty)') + '" stroke="var(--crust)" stroke-width="1.6" stroke-linejoin="round"/>';
      if (on) {
        const am = (a0 + a1) / 2;
        s += '<circle cx="' + (50 + 27 * Math.cos(am)).toFixed(2) + '" cy="' + (50 + 27 * Math.sin(am)).toFixed(2) + '" r="' + (d > 8 ? 3 : 4.2) + '" fill="var(--tomato)"/>';
      }
    }
    return s + '</svg>';
  }
  $('heroPz').outerHTML = pizza(5, 8).replace('class="pz"', 'class="pz" id="heroPz"');

  function makeQ() {
    const L = LEVELS[level];
    const d = rnd(L.min, L.max);
    let kind = Math.random() < .5 ? 'add' : 'sub';
    let miss = level === 3 && Math.random() < .35;
    let a, b, r;
    if (kind === 'add') { a = rnd(1, d - 2); b = rnd(1, d - a); r = a + b; }
    else { a = rnd(2, d); b = rnd(1, a - 1); r = a - b; }
    const sym = kind === 'add' ? '+' : '−';
    const terms = [{ n: a, d: d }, { n: b, d: d }, { n: r, d: d }];
    const hid = miss ? 1 : 2;
    const opts = new Map();
    let answer, explain, ask;
    if (!miss) {
      const put = (n, dd) => { const k = n + '/' + dd; if (!opts.has(k)) opts.set(k, { key: k, html: fr(n, dd) }); };
      answer = r + '/' + d;
      put(r, d);
      put(kind === 'add' ? r : a + b, kind === 'add' ? 2 * d : d);
      shuffle([r + 1, r - 1, r + 2, r - 2]).forEach(c => { if (c >= 1 && c <= d && opts.size < 4) put(c, d); });
      for (let x = 1; opts.size < 4; x++) put(x, d);
      ask = kind === 'add' ? 'حاصل جمع را پیدا کنید' : 'حاصل تفریق را پیدا کنید';
      explain = 'مخرج‌ها برابرند، پس مخرج ' + fa(d) + ' می‌ماند. صورت‌ها را ' + (kind === 'add' ? 'جمع' : 'تفریق') + ' می‌کنیم: ' +
        fa(a) + ' ' + sym + ' ' + fa(b) + ' = ' + fa(r) + '. پاسخ: ' + fa(r) + ' بر ' + fa(d) + '.';
    } else {
      const put = n => { const k = String(n); if (!opts.has(k)) opts.set(k, { key: k, html: '<span class="big">' + fa(n) + '</span>' }); };
      answer = String(b);
      put(b);
      shuffle([b + 1, b - 1, b + 2, b - 2, r, a]).forEach(c => { if (c >= 1 && c <= d && opts.size < 4) put(c); });
      for (let x = 1; opts.size < 4; x++) put(x);
      ask = 'صورتِ گم‌شده را پیدا کنید';
      explain = kind === 'add'
        ? 'مخرج‌ها برابرند. صورتِ گم‌شده را از ' + fa(r) + ' − ' + fa(a) + ' = ' + fa(b) + ' به دست می‌آوریم.'
        : 'مخرج‌ها برابرند. صورتِ گم‌شده را از ' + fa(a) + ' − ' + fa(r) + ' = ' + fa(b) + ' به دست می‌آوریم.';
    }
    return { terms, hid, sym, miss, answer, ask, explain, options: shuffle(Array.from(opts.values()).slice(0, 4)) };
  }

  function termHTML(t, hidden, revealed) {
    const q = hidden && !revealed;
    const pz = q ? '<div class="pz qm">؟</div>' : pizza(t.n, t.d);
    const f = q ? '<span class="fr"><span class="n">؟</span><span class="d">' + (cur.miss ? fa(t.d) : '؟') + '</span></span>' : fr(t.n, t.d);
    return '<div class="term">' + pz + f + '</div>';
  }
  function renderEq(revealed) {
    const t = cur.terms;
    $('eq').innerHTML =
      termHTML(t[0], false, true) + '<span class="sym">' + cur.sym + '</span>' +
      termHTML(t[1], cur.hid === 1, revealed) + '<span class="sym">=</span>' +
      termHTML(t[2], cur.hid === 2, revealed);
  }
  function renderTeams() {
    const el = $('teamsEl'); el.innerHTML = '';
    teams.forEach((t, i) => {
      const div = document.createElement('div');
      div.className = 'team' + (i === turn ? ' on' : '');
      div.style.setProperty('--tc', 'var(--t' + i + ')');
      const nm = document.createElement('span'); nm.className = 'tn'; nm.textContent = t.name;
      const sc = document.createElement('span'); sc.className = 'ts'; sc.textContent = fa(t.score) + ' امتیاز';
      div.append(nm, sc); el.append(div);
    });
  }

  function show(id) { ['setup', 'game', 'results'].forEach(s => { $(s).hidden = s !== id; }); }

  function nextQ() {
    turn = qi % teams.length;
    cur = makeQ(); locked = false;
    $('roundTxt').textContent = 'سوال ' + fa(qi + 1) + ' از ' + fa(total);
    const tt = $('turnTxt');
    if (tcount === 1) {
      tt.hidden = true;
    } else {
      tt.hidden = false;
      tt.style.setProperty('--tc', 'var(--t' + turn + ')');
      tt.innerHTML = 'نوبت: <span></span>'; tt.querySelector('span').textContent = teams[turn].name;
    }
    $('askTxt').textContent = cur.ask;
    renderTeams(); renderEq(false);
    const box = $('opts'); box.innerHTML = '';
    cur.options.forEach((o, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'opt'; b.dataset.key = o.key;
      b.innerHTML = '<span class="key">' + fa(i + 1) + '</span>' + o.html;
      b.addEventListener('click', () => answer(o.key));
      box.append(b);
    });
    $('fbWrap').innerHTML = ''; $('nextBtn').hidden = true;
    $('barWrap').hidden = !timed;
    if (timed) startTimer();
  }

  function startTimer() {
    stopTimer(); startAt = Date.now();
    const fill = $('barFill');
    fill.style.transform = 'scaleX(1)';
    fill.style.background = 'var(--basil)';
    timer = setInterval(() => {
      const left = Math.max(0, LIMIT - (Date.now() - startAt) / 1000);
      fill.style.transform = 'scaleX(' + (left / LIMIT) + ')';
      fill.style.background = left < 8 ? 'var(--tomato)' : 'var(--basil)';
      if (left <= 0) answer(null);
    }, 100);
  }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

  function answer(key) {
    if (locked) return; locked = true;
    const left = timed ? Math.max(0, LIMIT - (Date.now() - startAt) / 1000) : 0;
    stopTimer();
    const ok = key === cur.answer;
    document.querySelectorAll('.opt').forEach(b => {
      b.disabled = true;
      if (b.dataset.key === cur.answer) b.classList.add('right');
      else if (b.dataset.key === key) b.classList.add('wrong');
    });
    renderEq(true);
    let msg, cls;
    if (ok) {
      const pts = 10 + (timed ? Math.round(5 * left / LIMIT) : 0);
      teams[turn].score += pts;
      teams[turn].correct += 1;
      msg = tcount === 1
        ? 'آفرین! +' + fa(pts) + ' امتیاز گرفتی.'
        : 'آفرین! ' + fa(pts) + ' امتیاز برای ' + teams[turn].name;
      cls = 'ok';
    } else {
      msg = key === null ? 'زمان تمام شد!' : 'این بار اشتباه شد.';
      cls = 'no';
    }
    const fb = document.createElement('div');
    fb.className = 'fb pop ' + cls;
    const st = document.createElement('strong'); st.textContent = msg;
    const p = document.createElement('div'); p.textContent = cur.explain;
    fb.append(st, p);
    $('fbWrap').innerHTML = ''; $('fbWrap').append(fb);
    renderTeams();
    const nb = $('nextBtn');
    nb.textContent = qi + 1 >= total ? 'نتیجه نهایی' : 'سوال بعدی';
    nb.hidden = false; nb.focus();
  }

  function finish() {
    stopTimer(); show('results');
    const soloWrap = $('soloWrap');
    const rank = $('rank');
    rank.innerHTML = '';
    if (tcount === 1) {
      const p = teams[0];
      const pct = Math.round((p.correct / total) * 100);
      $('winTxt').textContent = 'خسته نباشی ' + p.name + '!';
      soloWrap.hidden = false;
      soloWrap.innerHTML =
        '<div class="stat-box"><span>پاسخ درست</span><b>' + fa(p.correct) + ' از ' + fa(total) + '</b></div>' +
        '<div class="stat-box"><span>دقت پاسخ‌گویی</span><b>٪' + fa(pct) + '</b></div>' +
        '<div class="stat-box"><span>امتیاز کل</span><b>' + fa(p.score) + '</b></div>';
    } else {
      soloWrap.hidden = true;
      const sorted = teams.slice().sort((a, b) => b.score - a.score);
      const top = sorted[0].score;
      const winners = sorted.filter(t => t.score === top);
      $('winTxt').textContent = winners.length > 1 ? 'مساوی شدید!' : 'برنده: ' + winners[0].name;
      sorted.forEach(t => {
        const row = document.createElement('div');
        const a = document.createElement('span'); a.textContent = t.name;
        const b = document.createElement('span'); b.textContent = fa(t.score) + ' امتیاز';
        row.append(a, b); rank.append(row);
      });
    }
  }

  $('nextBtn').addEventListener('click', () => { qi++; if (qi >= total) finish(); else nextQ(); });
  $('startBtn').addEventListener('click', () => {
    if (tcount === 1) {
      teams = [{ name: soloName.trim() || 'دانش‌آموز پرتلاش', score: 0, correct: 0 }];
    } else {
      teams = teamNames.slice(0, tcount).map((n, i) => ({ name: n.trim() || ('تیم ' + fa(i + 1)), score: 0, correct: 0 }));
    }
    total = per * tcount; qi = 0; timed = $('timed').checked;
    show('game'); nextQ();
  });
  $('againBtn').addEventListener('click', () => { stopTimer(); show('setup'); });
  $('quitBtn').addEventListener('click', () => { stopTimer(); show('setup'); });
  $('fsBtn').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) { const p = document.exitFullscreen(); if (p && p.catch) p.catch(() => {}); }
      else { const p = document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
    } catch (e) {}
  });

  function seg(id, setter) {
    $(id).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
      setter(+b.dataset.v);
    });
  }
  seg('segLevel', v => { level = v; });
  seg('segPer', v => { per = v; });
  seg('segTeams', v => { tcount = v; renderNames(); });

  function renderNames() {
    const box = $('names'); box.innerHTML = '';
    if (tcount === 1) {
      $('namesLbl').textContent = 'نام دانش‌آموز';
      $('perLbl').textContent = 'تعداد سوال‌ها';
      const inp = document.createElement('input');
      inp.type = 'text'; inp.value = soloName; inp.maxLength = 24;
      inp.setAttribute('aria-label', 'نام دانش‌آموز');
      inp.style.setProperty('--tc', 'var(--t1)');
      inp.addEventListener('input', () => { soloName = inp.value; });
      box.append(inp);
    } else {
      $('namesLbl').textContent = 'نام تیم‌ها';
      $('perLbl').textContent = 'تعداد سوال برای هر تیم';
      for (let i = 0; i < tcount; i++) {
        const inp = document.createElement('input');
        inp.type = 'text'; inp.id = 'name' + i; inp.value = teamNames[i]; inp.maxLength = 20;
        inp.setAttribute('aria-label', 'نام تیم ' + fa(i + 1));
        inp.style.setProperty('--tc', 'var(--t' + i + ')');
        inp.addEventListener('input', () => { teamNames[i] = inp.value; });
        box.append(inp);
      }
    }
  }
  renderNames();

  document.addEventListener('keydown', e => {
    if ($('game').hidden) return;
    if (e.target && e.target.tagName === 'INPUT') return;
    if (!locked && e.key >= '1' && e.key <= '4') {
      const o = cur.options[+e.key - 1]; if (o) answer(o.key);
    } else if (locked && e.key === 'Enter' && !$('nextBtn').hidden && document.activeElement !== $('nextBtn')) {
      $('nextBtn').click();
    }
  });
})();
</script>
</body>
</html>
